<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode Keamanan Terverifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .pin-digit {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            width: 42px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        /* Custom Modal Style */
        #custom-popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-container {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden card-container border border-slate-100">
        <!-- Header Section -->
        <div class="bg-indigo-600 p-8 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-white/20 rounded-2xl mb-4 backdrop-blur-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white leading-tight">Jangan bagikan link atau kode ini ke orang lain, simpan buat dirimu sendiri</h1>
        </div>

        <div class="p-10 text-center">
            <!-- PIN & Copy Action -->
            <div class="space-y-6">
                <div class="flex items-center justify-center gap-3">
                    <div id="pin-container" class="flex gap-2">
                        <!-- PIN Statis: 250426 -->
                        <div class="pin-digit">2</div>
                        <div class="pin-digit">5</div>
                        <div class="pin-digit">0</div>
                        <div class="pin-digit">4</div>
                        <div class="pin-digit">2</div>
                        <div class="pin-digit">6</div>
                    </div>
                </div>

                <button onclick="copyPin()" class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl transition duration-300 shadow-lg shadow-indigo-200 active:scale-95 w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    Salin Kode PIN
                </button>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="bg-slate-50 border-t border-slate-100 p-8 text-center">
            <p class="text-lg font-bold text-slate-700 uppercase tracking-tight">Tolong hargai kreator</p>
        </div>
    </div>

    <!-- Pop Up Modal -->
    <div id="custom-popup" onclick="closePopup()">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full text-center shadow-2xl transform transition-all" onclick="event.stopPropagation()">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-4">Berhasil Disalin!</h3>
            <p class="text-slate-600 text-sm leading-relaxed mb-8">
                Kamu telah menyumbang setidaknya 10 rupiah untuk kreator yang rela menghabiskan waktunya demi membuatnya, mohon jangan bagikan kode ini.
            </p>
            <button onclick="closePopup()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition shadow-lg">
                Tutup Kembali
            </button>
        </div>
    </div>

    <script>
        // PIN sudah dipatok permanen di HTML, fungsi ini hanya untuk variabel salin
        const currentPin = "250426";

        function copyPin() {
            // Menggunakan metode textarea untuk kompatibilitas luas
            const el = document.createElement('textarea');
            el.value = currentPin;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            // Tampilkan popup
            document.getElementById('custom-popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('custom-popup').style.display = 'none';
        }
    </script>
</body>
</html>
